<script>
    let progressStartTime = null;
    let currentPage = 1;
    const PAGE_SIZE = 2000;

    function showProgress(visible, text = '', pct = 0) {
        const container = document.getElementById('progressContainer');
        if (!container) return;
        if (visible) {
            container.style.display = 'block';
            const progBar = document.getElementById('progressBar');
            const progText = document.getElementById('progressText');
            const progPercent = document.getElementById('progressPercent');

            if (!progressStartTime || pct === 0) {
                progressStartTime = Date.now();
            }

            let etrString = '';
            if (pct > 2 && progressStartTime) {
                const elapsed = (Date.now() - progressStartTime) / 1000;
                const remaining = Math.round(elapsed * (100 - pct) / pct);
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                etrString = m > 0 ? `${m}m ${s}s` : `${s}s`;
            }

            if (progBar) progBar.style.width = pct + '%';
            if (progText) progText.textContent = text;
            if (progPercent) {
                progPercent.textContent = Math.round(pct) + '%' + (etrString ? ` ~ ${etrString}` : '');
            }
        } else {
            container.style.display = 'none';
            progressStartTime = null;
        }
    }

    function triggerAutoSessionSyncAndRetry(forceFetchAll, executeFetch) {
        Swal.fire({
            title: 'Sesi Terblokir (Anti-bot F5)',
            html: 'Mendeteksi proteksi WAF. Mencoba menyegarkan sesi di tab browser secara otomatis...<br><br><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>',
            allowOutsideClick: false,
            showConfirmButton: false,
            showCancelButton: true,
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.dismiss === Swal.DismissReason.cancel) {
                window.removeEventListener("FasihSessionSyncComplete", onSyncComplete);
                clearTimeout(timeoutId);
            }
        });

        let timeoutId = setTimeout(() => {
            window.removeEventListener("FasihSessionSyncComplete", onSyncComplete);
            showWafManualFallback();
        }, 10000);

        function onSyncComplete(e) {
            clearTimeout(timeoutId);
            window.removeEventListener("FasihSessionSyncComplete", onSyncComplete);
            Swal.close();
            if (e.detail && e.detail.success) {
                console.log("[Auto Sync] Session sync success! Retrying fetch...");
                executeFetch(forceFetchAll);
            } else {
                console.warn("[Auto Sync] Session sync failed or tab not found.");
                showWafManualFallback();
            }
        }

        window.addEventListener("FasihSessionSyncComplete", onSyncComplete);
        window.dispatchEvent(new CustomEvent("FasihRequestNewSession"));
    }

    function showWafManualFallback() {
        Swal.fire({
            title: '⚠️ Gagal Sinkron Sesi Otomatis',
            html: 'Sistem tidak dapat menyegarkan sesi secara otomatis.<br>Silakan ikuti langkah manual berikut:<br><ol class="text-start small"><li>Buka tab <b>Fasih-SM</b> di browser Anda.</li><li><b>Refresh / Reload</b> tab tersebut untuk menyelesaikan WAF challenge.</li><li>Klik ikon ekstensi <b>Fasih Session Sync</b> untuk memperbarui cookie.</li><li>Kembali ke tab ini dan klik <b>Tampilkan</b> kembali.</li></ol>',
            icon: 'warning',
            confirmButtonText: 'Mengerti'
        });
    }

    // ==========================================
    // REGION HIERARCHY & AGGREGATION HELPERS (STEP 1)
    // ==========================================

    async function fetchChildRegions(targetLevel, parentFullCode = '') {
        if (!currentGroupId) return [];
        let url = `/fasihsm-fetcher/api/proxy/region/level/${targetLevel}?groupId=${currentGroupId}`;
        if (parentFullCode && targetLevel > 1) {
            const parentParamKey = `level${targetLevel - 1}FullCode`;
            url += `&${parentParamKey}=${encodeURIComponent(parentFullCode)}`;
        }
        try {
            const res = await fetch(url);
            if (!res.ok) return [];
            const data = await res.json();
            let items = [];
            if (Array.isArray(data)) items = data;
            else if (data && data.data && Array.isArray(data.data)) items = data.data;
            else if (data && data.content && Array.isArray(data.content)) items = data.content;

            return items.map(item => ({
                id: item.id || item.regionId || item.code,
                code: item.code || item.regionCode || '',
                fullCode: item.fullCode || item.full_code || item.code || '',
                name: item.name || item.regionName || item.label || ''
            }));
        } catch (e) {
            console.error(`[fetchChildRegions] Error level ${targetLevel}:`, e);
            return [];
        }
    }

    async function fetchRegionSampleCount(filterObj) {
        if (!currentPeriodId) return 0;
        let url = `/fasihsm-fetcher/api/sampel-status?period_id=${encodeURIComponent(currentPeriodId)}`;
        if (filterObj.region_id) url += `&region_id=${encodeURIComponent(filterObj.region_id)}`;
        if (filterObj.region_level) url += `&region_level=${encodeURIComponent(filterObj.region_level)}`;
        try {
            const res = await fetch(url);
            if (!res.ok) return 0;
            const data = await res.json();
            return data.total || 0;
        } catch (e) {
            console.error('[fetchRegionSampleCount] Error:', e);
            return 0;
        }
    }

    // ==========================================
    // SAMPEL FETCH & TABLE RENDERING ENGINE
    // ==========================================

    let isStopFetchRequested = false;
    let cooldownTimerInterval = null;

    function stopFetchSampel() {
        isStopRequested = true;
        isStopFetchRequested = true;
        if (cooldownTimerInterval) clearInterval(cooldownTimerInterval);
        if (typeof Swal !== 'undefined' && Swal.isVisible()) Swal.close();

        const btn = document.getElementById('btnFetchSampel');
        const stopBtn = document.getElementById('btnStopFetch');
        if (btn) { btn.disabled = false; btn.textContent = 'Tampilkan'; }
        if (stopBtn) { stopBtn.style.display = 'none'; }
        showProgress(false);

        if (currentPeriodId) {
            fetch('/fasihsm-fetcher/api/sampel-stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ period_id: currentPeriodId })
            }).catch(e => console.error(e));
        }
    }

    function showRateLimitCooldownModal(seconds = 120) {
        return new Promise((resolve) => {
            let remaining = seconds;

            const getHtmlContent = (sec) => `
                <div class="text-center py-2">
                    <div class="fs-1 mb-2">⏳</div>
                    <h5 class="fw-bold text-warning">Sedang Cooldown Rate Limit (429)</h5>
                    <p class="text-muted small">Server BPS membatasi jumlah request. Menunggu cooldown otomatis:</p>
                    <div class="display-6 fw-bold text-primary mb-3" id="cooldownTimerDisplay">${sec}s</div>
                    <p class="small text-secondary mb-0">Proses fetch tidak dihentikan. Anda dapat menekan tombol di bawah untuk langsung melanjutkan fetch sekarang.</p>
                </div>
            `;

            Swal.fire({
                title: '',
                html: getHtmlContent(remaining),
                showCancelButton: true,
                confirmButtonText: '⚡ Lanjutkan Fetch Sekarang',
                cancelButtonText: '🛑 Stop Fetch',
                confirmButtonColor: '#ffc107',
                cancelButtonColor: '#dc3545',
                allowOutsideClick: false,
                allowEscapeKey: false,
                didOpen: () => {
                    const timerEl = document.getElementById('cooldownTimerDisplay');
                    cooldownTimerInterval = setInterval(() => {
                        remaining--;
                        if (timerEl) timerEl.textContent = `${remaining}s`;
                        if (remaining <= 0) {
                            clearInterval(cooldownTimerInterval);
                            Swal.close();
                            resolve({ action: 'continue' });
                        }
                    }, 1000);
                },
                willClose: () => {
                    if (cooldownTimerInterval) clearInterval(cooldownTimerInterval);
                }
            }).then((result) => {
                if (cooldownTimerInterval) clearInterval(cooldownTimerInterval);
                if (result.isConfirmed) {
                    resolve({ action: 'continue' });
                } else if (result.dismiss === Swal.DismissReason.cancel) {
                    stopFetchSampel();
                    resolve({ action: 'stop' });
                }
            });
        });
    }

    function fetchChunkWithPageSize150(filters) {
        return new Promise((resolve, reject) => {
            let chunkRows = [];
            let hasError = null;

            fetch('/fasihsm-fetcher/api/sampel-fetch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    period_id: currentPeriodId,
                    survey_id: currentSurveyId,
                    filters: {
                        ...filters,
                        limit: 150
                    }
                })
            })
                .then(res => {
                    if (res.status === 429) {
                        throw new Error('HTTP 429 Rate Limit');
                    }
                    if (!res.ok) {
                        return res.text().then(t => { throw new Error(t || `HTTP ${res.status}`); });
                    }
                    if (!res.body) throw new Error('Response stream kosong');

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    function read() {
                        return reader.read().then(({ done, value }) => {
                            if (done) {
                                if (hasError) reject(new Error(hasError));
                                else resolve(chunkRows);
                                return;
                            }
                            buffer += decoder.decode(value, { stream: true });
                            const parts = buffer.split('\n\n');
                            buffer = parts.pop();

                            for (const part of parts) {
                                const line = part.replace(/^data: /, '').trim();
                                if (!line) continue;
                                try {
                                    const msg = JSON.parse(line);
                                    if (msg.type === 'rate_limit_wait') {
                                        reject(new Error('HTTP 429 Rate Limit'));
                                        return;
                                    }
                                    if (msg.done) {
                                        if (msg.error) {
                                            hasError = msg.error;
                                        } else {
                                            chunkRows = msg.rows || [];
                                        }
                                    }
                                } catch (e) {
                                    console.error('Error parsing SSE chunk:', e);
                                }
                            }
                            return read();
                        }).catch(reject);
                    }
                    return read();
                })
                .catch(reject);
        });
    }

    async function runHierarchicalRegionFetch() {
        if (!currentPeriodId) { alert('Pilih survei terlebih dahulu.'); return; }

        isStopFetchRequested = false;
        isStopRequested = false;

        const btn = document.getElementById('btnFetchSampel');
        const stopBtn = document.getElementById('btnStopFetch');
        const chkAppend = document.getElementById('chkAppendFilter');

        if (chkAppend && !chkAppend.checked) {
            chkAppend.checked = true;
        }

        if (btn) { btn.disabled = true; btn.textContent = 'Menganalisis Wilayah...'; }
        if (stopBtn) { stopBtn.disabled = false; stopBtn.style.display = 'inline-block'; }

        showProgress(true, 'Menyiapkan hierarki wilayah...', 0);

        const startLevel = typeof currentLevel2Code !== 'undefined' && currentLevel2Code ? 3 : (typeof currentLevel1Code !== 'undefined' && currentLevel1Code ? 2 : 1);
        const maxLevel = regionMetadata && regionMetadata.levelCount ? regionMetadata.levelCount : 4;
        const baseFilters = collectCurrentSampelFilters();

        let rootNodes = [];

        for (let l = startLevel; l <= maxLevel; l++) {
            const cbs = Array.from(document.querySelectorAll(`#regionMenu_${l} input[type="checkbox"]:checked`)).filter(cb => cb.value !== 'SEMUA');
            if (cbs.length > 0) {
                rootNodes = cbs.map(cb => ({
                    id: cb.value,
                    code: cb.getAttribute('data-code') || cb.value,
                    fullCode: cb.getAttribute('data-full-code') || cb.getAttribute('data-code') || cb.value,
                    name: getBaseLabelText(cb.closest('label')),
                    level: l
                }));
                break;
            }
        }

        if (rootNodes.length === 0) {
            let parentCode = '';
            if (startLevel === 3 && typeof currentLevel2Code !== 'undefined') parentCode = currentLevel2Code;
            else if (startLevel === 2 && typeof currentLevel1Code !== 'undefined') parentCode = currentLevel1Code;

            showProgress(true, `Memuat daftar subunit wilayah Level ${startLevel}...`, 5);
            const topChildren = await fetchChildRegions(startLevel, parentCode);
            if (topChildren.length > 0) {
                rootNodes = topChildren.map(c => ({ ...c, level: startLevel }));
            } else {
                rootNodes = [{ id: '', code: '', fullCode: parentCode, name: 'Semua Wilayah', level: startLevel }];
            }
        }

        let totalNodesProcessed = 0;
        let totalSamplesFetched = 0;

        async function processRegionNode(node) {
            if (isStopFetchRequested) return;

            const currentLevel = node.level;
            const regionFilterObj = {
                ...baseFilters,
                region_id: node.id,
                region_level: currentLevel
            };

            if (node.id && node.id !== 'SEMUA') {
                regionFilterObj[`region${currentLevel}Id`] = [node.id];
                regionFilterObj[`region${currentLevel}Code`] = [node.code || node.id];
            }

            showProgress(true, `🔍 Memeriksa jumlah sampel [${node.name || 'Wilayah'}]...`, Math.min(95, totalNodesProcessed * 5));

            const sampleCount = await fetchRegionSampleCount(regionFilterObj);
            console.log(`[RegionBreakdown] Level ${currentLevel} (${node.name}): Total = ${sampleCount}`);

            if (sampleCount < 999 || currentLevel >= maxLevel) {
                showProgress(true, `📥 Mengambil sampel [${node.name}] (${sampleCount} sampel)...`, Math.min(95, totalNodesProcessed * 5));

                let success = false;
                while (!success && !isStopFetchRequested) {
                    try {
                        const rows = await fetchChunkWithPageSize150(regionFilterObj);
                        if (rows && Array.isArray(rows)) {
                            setDatasetSource(rows, false);
                            renderSampelRows(filterRowsLocally(getDatasetFilterSource(), collectCurrentSampelFilters()));
                            if (typeof updateDropdownLocalCounts === 'function') updateDropdownLocalCounts();

                            totalSamplesFetched += rows.length;
                            totalNodesProcessed++;
                            showProgress(true, `✅ Selesai [${node.name}] (+${rows.length} sampel | Total: ${totalSamplesFetched})`, Math.min(95, totalNodesProcessed * 5));
                            success = true;
                        }
                    } catch (err) {
                        if (isStopFetchRequested) return;
                        const errText = String(err.message || err);
                        if (errText.includes('429') || errText.includes('rate limit') || errText.includes('RATE_LIMIT')) {
                            const modalRes = await showRateLimitCooldownModal(120);
                            if (modalRes.action === 'stop') return;
                        } else {
                            console.error(`[ChunkFetchError] ${node.name}:`, err);
                            await new Promise(r => setTimeout(r, 3000));
                        }
                    }
                }

                if (!isStopFetchRequested) {
                    const pauseMs = 2000 + Math.floor(Math.random() * 1000);
                    await new Promise(r => setTimeout(r, pauseMs));
                }
            } else {
                const nextLevel = currentLevel + 1;
                showProgress(true, `🔀 Memecah [${node.name}] (${sampleCount} sampel ≥ 999) ke Level ${nextLevel}...`, Math.min(95, totalNodesProcessed * 5));

                const children = await fetchChildRegions(nextLevel, node.fullCode || node.code);
                if (children && children.length > 0) {
                    for (const childNode of children) {
                        if (isStopFetchRequested) break;
                        await processRegionNode({
                            ...childNode,
                            level: nextLevel
                        });
                    }
                } else {
                    try {
                        const rows = await fetchChunkWithPageSize150(regionFilterObj);
                        if (rows) {
                            setDatasetSource(rows, false);
                            renderSampelRows(filterRowsLocally(getDatasetFilterSource(), collectCurrentSampelFilters()));
                            totalSamplesFetched += rows.length;
                        }
                    } catch (err) {
                        console.error(`[FallbackFetchError] ${node.name}:`, err);
                    }
                }
            }
        }

        for (const rootNode of rootNodes) {
            if (isStopFetchRequested) break;
            await processRegionNode(rootNode);
        }

        if (!isStopFetchRequested) {
            showProgress(true, `🎉 Seluruh wilayah selesai diambil! Total ${totalSamplesFetched} sampel diappend.`, 100);
            setTimeout(() => showProgress(false), 3500);
        }

        if (btn) { btn.disabled = false; btn.textContent = 'Tampilkan'; }
        if (stopBtn) { stopBtn.style.display = 'none'; }
    }

    function fetchSampel() {
        if (!currentPeriodId) { alert('Pilih survei terlebih dahulu.'); return; }

        const isBatch = document.getElementById('chkBatchCrawl') &&
            document.getElementById('chkBatchCrawl').checked;
        if (isBatch) {
            fetchBatchCrawl();
        } else {
            runHierarchicalRegionFetch();
        }
    }

    function collectCurrentSampelFilters() {
        const filters = {};

        // Status filter
        const selectedStatuses = getSelectedValues('statusMenu').filter(v => v !== 'SEMUA');
        if (selectedStatuses.length > 0) {
            filters.status_alias = selectedStatuses;
        }

        // Wilayah filter
        if (regionMetadata && regionMetadata.levelCount >= 3) {
            const startLevel = typeof currentLevel2Code !== 'undefined' && currentLevel2Code ? 3 : (typeof currentLevel1Code !== 'undefined' && currentLevel1Code ? 2 : 1);
            for (let i = startLevel; i <= regionMetadata.levelCount; i++) {
                const cbs = Array.from(document.querySelectorAll(`#regionMenu_${i} input[type="checkbox"]:checked`)).filter(cb => cb.value !== 'SEMUA');
                if (cbs.length > 0) {
                    filters[`region${i}Id`] = cbs.map(cb => cb.value);
                    filters[`region${i}Code`] = cbs.map(cb => cb.getAttribute('data-code')).filter(Boolean);
                }
            }
        }

        // Pencacah filter
        const selectedPencacah = getSelectedValues('pencacahMenu').filter(v => v !== 'SEMUA');
        if (selectedPencacah.length > 0) {
            filters.user_id = selectedPencacah;
        }

        return filters;
    }

    function applyLocalSampelFiltersIfCached() {
        const chkAppend = document.getElementById('chkAppendFilter');
        if (chkAppend && chkAppend.checked) {
            return false;
        }
        const sourceRows = getDatasetFilterSource();
        if (!sourceRows || sourceRows.length === 0) return false;
        scheduleLocalFilterRender();
        return true;
    }

    let localFilterTimer = null;
    function scheduleLocalFilterRender() {
        clearTimeout(localFilterTimer);
        localFilterTimer = setTimeout(() => {
            const sourceRows = getDatasetFilterSource();
            if (!sourceRows || sourceRows.length === 0) return;
            renderSampelRows(filterRowsLocally(sourceRows, collectCurrentSampelFilters()));
            if (typeof updateDropdownLocalCounts === 'function') {
                updateDropdownLocalCounts();
            }
        }, 80);
    }

    function __fetchSampelStream(filters, forceFetchAll, btn, progress, executeFetch) {
        let highestProgress = 0;
        // Hentikan semua loading dropdown selama fetch berlangsung
        if (typeof setFetchInProgress === 'function') setFetchInProgress(true);
        fetch('/fasihsm-fetcher/api/sampel-fetch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                period_id: currentPeriodId,
                survey_id: currentSurveyId,
                filters: filters
            })
        })
            .then(res => {
                if (!res.ok) {
                    return res.text().then(text => {
                        throw new Error(text || `HTTP ${res.status}`);
                    });
                }
                if (!res.body) {
                    throw new Error('Response stream kosong.');
                }
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                function read() {
                    return reader.read().then(({ done, value }) => {
                        if (done) return;
                        buffer += decoder.decode(value, { stream: true });
                        const parts = buffer.split('\n\n');
                        buffer = parts.pop();
                        for (const part of parts) {
                            const line = part.replace(/^data: /, '').trim();
                            if (!line) continue;
                            try {
                                const msg = JSON.parse(line);
                                if (msg.type === "rate_limit_wait") {
                                    const pct = (msg.progress !== undefined) ? Number(msg.progress) : highestProgress;
                                    highestProgress = Math.max(highestProgress, pct);
                                    showProgress(true, `⏳ Rate limit — retry dalam ${msg.remaining}s (${msg.fetched}/${msg.total} terambil)`, pct);
                                    const retryBtn = document.getElementById('btnRetryNow');
                                    if (retryBtn) retryBtn.style.display = 'inline-block';
                                    continue;
                                }
                                const retryBtn = document.getElementById('btnRetryNow');
                                if (retryBtn) retryBtn.style.display = 'none';

                                if (msg.progress !== undefined && progress) {
                                    const nextProgress = Number(msg.progress) || 0;
                                    highestProgress = Math.max(highestProgress, nextProgress);
                                    progress.textContent = msg.message ? `${highestProgress}% - ${msg.message}` : highestProgress + '%';
                                    showProgress(true, msg.message || 'Mengambil data...', highestProgress);
                                }
                                if (msg.type === "confirm_fetchall") {
                                    Swal.fire({
                                        title: 'Big Sample Count Detected',
                                        text: `Gagal memfilter secara cepat karena data target terlalu besar (${msg.total} baris). Data akan ditarik keseluruhan baru filtering akan berjalan di lokal Anda. Lanjut?`,
                                        icon: 'warning',
                                        showCancelButton: true,
                                        confirmButtonText: 'Ya, Tarik Semua',
                                        cancelButtonText: 'Tidak'
                                    }).then((result) => {
                                        if (result.isConfirmed) {
                                            executeFetch(true);
                                        }
                                    });
                                    return;
                                }
                                if (msg.done) {
                                    if (msg.error) {
                                        if (msg.error.startsWith('WAF_CHALLENGE')) {
                                            triggerAutoSessionSyncAndRetry(forceFetchAll, executeFetch);
                                        } else {
                                            throw new Error(msg.error);
                                        }
                                        return;
                                    }
                                    if (msg.warning) {
                                        Swal.fire({
                                            title: 'Data Belum Lengkap',
                                            text: msg.warning,
                                            icon: 'warning'
                                        });
                                    }

                                    const hasStatusFilter = Array.isArray(filters.status_alias) && filters.status_alias.length > 0;
                                    const hasUserFilter = Array.isArray(filters.user_id) && filters.user_id.length > 0;
                                    const hasRegionFilter = Object.keys(filters).some(k => k.startsWith('region') && Array.isArray(filters[k]) && filters[k].length > 0);
                                    const hasSearchQuery = !!filters.search_query;
                                    const isUnfilteredFetch = !hasStatusFilter && !hasUserFilter && !hasRegionFilter && !hasSearchQuery;
                                    const fetchedRows = msg.rows || [];
                                    if (!msg.warning && (forceFetchAll || isUnfilteredFetch)) {
                                        setDatasetSource(fetchedRows, true);
                                        previewContext = getCurrentPreviewContext();
                                        Object.keys(liveCountCache || {}).forEach(k => delete liveCountCache[k]);
                                        document.getElementById('btnClearCache').style.display = 'inline-block';
                                        updateFetchButtonState();
                                    } else {
                                        setDatasetSource(fetchedRows, false);
                                    }

                                    if (forceFetchAll && globalDataCache) {
                                        const filtered = filterRowsLocally(getDatasetFilterSource(), filters);
                                        renderSampelRows(filtered);
                                    } else {
                                        renderSampelRows(filterRowsLocally(getDatasetFilterSource(), collectCurrentSampelFilters()));
                                    }
                                    if (typeof updateDropdownLocalCounts === 'function') {
                                        updateDropdownLocalCounts();
                                    }
                                }
                            } catch (e) {
                                if (e.name === "SyntaxError" || e.message === "Unexpected end of JSON input") {
                                    console.error('Gagal membaca event sampel:', part, e);
                                } else {
                                    throw e;
                                }
                            }
                        }
                        return read();
                    });
                }
                return read();
            })
            .catch(err => { alert('Gagal mengambil data: ' + err); })
            .finally(() => {
                if (btn) {
                    if (btn.id === 'btnFetchSearch') {
                        btn.disabled = false;
                        btn.innerHTML = '🔍';
                    } else {
                        btn.disabled = !!isFetchAllComplete;
                        btn.textContent = 'Tampilkan';
                    }
                }
                const stopBtn = document.getElementById('btnStopFetch');
                if (stopBtn) {
                    stopBtn.style.display = 'none';
                    stopBtn.disabled = false;
                    stopBtn.textContent = 'Stop Fetch';
                }
                const retryNowBtn = document.getElementById('btnRetryNow');
                if (retryNowBtn) retryNowBtn.style.display = 'none';
                updateFetchButtonState();
                if (progress) progress.style.display = 'none';
                showProgress(false);
                // Izinkan region loading lagi setelah fetch selesai
                if (typeof setFetchInProgress === 'function') setFetchInProgress(false);
            });
    }

    function stopFetchSampel() {
        if (!currentPeriodId) return;
        const stopBtn = document.getElementById('btnStopFetch');
        if (stopBtn) {
            stopBtn.disabled = true;
            stopBtn.textContent = 'Menghentikan...';
        }
        showProgress(false);
        fetch('/fasihsm-fetcher/api/sampel-stop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ period_id: currentPeriodId })
        }).catch(err => {
            console.error('Stop fetch error:', err);
            if (stopBtn) {
                stopBtn.disabled = false;
                stopBtn.textContent = 'Stop Fetch';
            }
        });
    }

    function filterRowsLocally(rows, filters) {
        return (rows || []).filter(r => {
            if (filters.status_alias && filters.status_alias.length > 0) {
                if (!filters.status_alias.includes(r.statusAlias || r.status_dok)) return false;
            }
            if (filters.user_id && filters.user_id.length > 0) {
                if (!filters.user_id.includes(r.userId)) return false;
            }
            for (let i = 3; i <= 10; i++) {
                const fCodes = filters[`region${i}Code`];
                if (fCodes && fCodes.length > 0) {
                    const rowCode = r.regionCodes && r.regionCodes[`level${i}`];
                    if (!fCodes.includes(rowCode)) return false;
                }
            }
            return true;
        });
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function getSearchText(row) {
        if (!row._searchText) {
            row._searchText = [
                row.no, row.id_sls, row.status_dok, row.pencacah, row.email_pcj,
                row.created, row.modified, row.sample_id, row.lat, row.lon,
                ...(row.regions || []),
                ...(customColumns || []).map(c => row[c.key])
            ].map(v => String(v ?? '').toLowerCase()).join(' ');
        }
        return row._searchText;
    }

    function getSortValue(row, key) {
        if (!key) return '';
        if (key.startsWith('custom:')) return row[key.replace('custom:', '')] ?? '';
        if (key.startsWith('region:')) {
            const idx = Number(key.replace('region:', ''));
            return row.regions && row.regions[idx] ? row.regions[idx] : '';
        }
        if (key === 'mode') {
            return Array.isArray(row.mode) ? row.mode.join(', ') : (row.mode ?? '');
        }
        if (key === 'keterangan') {
            return (row.sumError || 0) * 1000 + (row.sumRemark || 0);
        }
        return row[key] ?? '';
    }

    function applyViewTransform(rows) {
        let result = rows || [];
        const term = (datasetState.searchTerm || '').toLowerCase().trim();
        if (term) {
            const terms = term.split(';').map(t => t.trim()).filter(Boolean);
            if (terms.length > 0) {
                result = result.filter(row => {
                    const searchText = getSearchText(row);
                    return terms.some(t => searchText.includes(t));
                });
            }
        }
        if (datasetState.sortKey) {
            result = [...result].sort((a, b) => {
                const valA = String(getSortValue(a, datasetState.sortKey) ?? '').trim();
                const valB = String(getSortValue(b, datasetState.sortKey) ?? '').trim();
                const numA = parseFloat(valA);
                const numB = parseFloat(valB);
                let cmp;
                if (!isNaN(numA) && !isNaN(numB) && valA.match(/^-?\d+(\.\d+)?$/) && valB.match(/^-?\d+(\.\d+)?$/)) {
                    cmp = numA - numB;
                } else {
                    cmp = valA.localeCompare(valB);
                }
                return datasetState.sortAsc ? cmp : -cmp;
            });
        }
        return result;
    }

        const modeVal = Array.isArray(r.mode) ? r.mode.join(', ') : (r.mode || '-');

        let ketHtml = '';
        if (errorCount > 0) {

        }
        if (remarkCount > 0) {
            ketHtml += `<span class="badge bg-warning text-body me-1" title="${remarkCount} Remark">${remarkCount} R</span>`;
        }
        if (cleanCount > 0) {
            ketHtml += `<span class="badge bg-success me-1" title="${cleanCount} Clean">${cleanCount} C</span>`;
        }
        if (!ketHtml) {
            ketHtml = '<span class="text-muted">-</span>';
        }

        let rHtml = `

    function updateMissingKeysAlert(displayedRows) {
        const alertDiv = document.getElementById('searchKeysNotFoundAlert');
        const listSpan = document.getElementById('searchKeysNotFoundList');
        if (!alertDiv || !listSpan) return;

        const searchEl = document.getElementById('tableSearch');
        const term = searchEl ? (searchEl.value || '').trim() : '';

        if (!term) {
            alertDiv.style.setProperty('display', 'none', 'important');
            return;
        }

        const keys = term.split(';').map(k => k.trim()).filter(Boolean);
        if (keys.length === 0) {
            alertDiv.style.setProperty('display', 'none', 'important');
            return;
        }

        const missingKeys = [];
        keys.forEach(key => {
            const keyLower = key.toLowerCase();
            const found = displayedRows.some(row => getSearchText(row).includes(keyLower));
            if (!found) {
                missingKeys.push(key);
            }
        });

        if (missingKeys.length > 0) {
            listSpan.textContent = missingKeys.join(', ');
            alertDiv.style.setProperty('display', 'flex', 'important');
        } else {
            alertDiv.style.setProperty('display', 'none', 'important');
        }
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            const source = datasetState.viewBaseRows.length ? datasetState.viewBaseRows : getDatasetFilterSource();
            renderSampelRows(source, { keepPage: true });
        }
    }

    function nextPage() {
        const source = datasetState.viewBaseRows.length ? datasetState.viewBaseRows : getDatasetFilterSource();
        const totalPages = Math.ceil(source.length / PAGE_SIZE) || 1;
        if (currentPage < totalPages) {
            currentPage++;
            renderSampelRows(source, { keepPage: true });
        }
    }

    function renderSampelRows(rows, options = {}) {
        rows = rows || [];
        datasetState.viewBaseRows = rows;
        const viewRows = options.skipViewTransform ? rows : applyViewTransform(rows);
        setDatasetVisible(viewRows);
        const hasData = lastFetchedIds.length > 0;
        const badge = document.getElementById('sampelBadge');
        const tbody = document.getElementById('sampelTbody');
        if (typeof updateDownloadButtonsState === 'function') {
            updateDownloadButtonsState(hasData);
        }
        if (badge) {
            badge.textContent = datasetState.searchTerm ? `${viewRows.length} Data (Filtered)` : `${viewRows.length} Data`;
            badge.style.display = viewRows.length ? '' : 'none';
        }

        const searchEl = document.getElementById('tableSearch');
        if (searchEl) searchEl.style.display = 'block';
        if (!tbody) return;

        if (viewRows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="30" class="text-center py-4 text-muted"><i>Tidak ada data.</i></td></tr>';
            updateFetchButtonState();
            updateMissingKeysAlert([]);
            const pagContainer = document.getElementById('paginationContainer');
            if (pagContainer) pagContainer.style.display = 'none';
            return;
        }

        if (!options.keepPage) {
            currentPage = 1;
        }
        const totalRows = viewRows.length;
        const totalPages = Math.ceil(totalRows / PAGE_SIZE) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIdx = (currentPage - 1) * PAGE_SIZE;
        const endIdx = Math.min(startIdx + PAGE_SIZE, totalRows);
        const pageRows = viewRows.slice(startIdx, endIdx);

        tbody.innerHTML = pageRows.map(buildSampelRowHtml).join('');

        const pagContainer = document.getElementById('paginationContainer');
        if (pagContainer) {
            if (totalRows > PAGE_SIZE) {
                pagContainer.style.setProperty('display', 'flex', 'important');
                const pagInfo = document.getElementById('paginationInfo');
                const pagPageNum = document.getElementById('paginationPageNum');
                const btnPrev = document.getElementById('btnPrevPage');
                const btnNext = document.getElementById('btnNextPage');

                if (pagInfo) pagInfo.textContent = `Menampilkan ${startIdx + 1}-${endIdx} dari ${totalRows} data`;
                if (pagPageNum) pagPageNum.textContent = `Halaman ${currentPage} / ${totalPages}`;
                if (btnPrev) btnPrev.disabled = currentPage === 1;
                if (btnNext) btnNext.disabled = currentPage === totalPages;
            } else {
                pagContainer.style.setProperty('display', 'none', 'important');
            }
        }

        updateFetchButtonState();
        updateMissingKeysAlert(viewRows);
    }

    let currentSortCol = -1;
    let currentSortAsc = true;

    function sortTable(colIdx, thElement) {
        const tbody = document.getElementById('sampelTbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        if (rows.length === 0 || rows[0].querySelector('td[colspan]')) return;

        document.querySelectorAll('.sortable-col').forEach(th => {
            th.innerHTML = th.innerHTML.replace(/ (?:\^|v|\u25B2|\u25BC|\u00E2\u2013\u00B2|\u00E2\u2013\u00BC|\u00C3\u00A2\u00E2\u20AC\u201C\u00C2\u00B2|\u00C3\u00A2\u00E2\u20AC\u201C\u00C2\u00BC)$/g, '');
        });

        if (currentSortCol === colIdx) {
            currentSortAsc = !currentSortAsc;
        } else {
            currentSortCol = colIdx;
            currentSortAsc = true;
        }

        thElement.innerHTML += currentSortAsc ? ' ^' : ' v';

        rows.sort((a, b) => {
            let valA = a.children[colIdx].innerText.trim();
            let valB = b.children[colIdx].innerText.trim();

            const numA = parseFloat(valA);
            const numB = parseFloat(valB);

            if (!isNaN(numA) && !isNaN(numB) && valA.match(/^-?\d+(\.\d+)?$/) && valB.match(/^-?\d+(\.\d+)?$/)) {
                return currentSortAsc ? numA - numB : numB - numA;
            }

            return currentSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });

        rows.forEach(row => tbody.appendChild(row));
    }

    // ==========================================
    // BATCH CRAWL STREAM
    // ==========================================

    function fetchBatchCrawl() {
        if (!currentPeriodId) { alert('Pilih survei terlebih dahulu.'); return; }

        const btn = document.getElementById('btnFetchSampel');
        const stopBtn = document.getElementById('btnStopFetch');
        const retryBtn = document.getElementById('btnRetryNow');
        const progress = document.getElementById('fetchProgress');

        btn.disabled = true;
        btn.textContent = 'Batch Crawl...';
        if (stopBtn) { stopBtn.disabled = false; stopBtn.textContent = 'Stop Fetch'; stopBtn.style.display = 'inline-block'; }
        if (retryBtn) retryBtn.style.display = 'none';
        showProgress(true, 'Memulai batch crawl...', 0);
        if (typeof setFetchInProgress === 'function') setFetchInProgress(true);

        let highestProgress = 0;

        fetch('/fasihsm-fetcher/api/batch-crawl-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ period_id: currentPeriodId })
        })
            .then(res => {
                if (!res.ok) return res.text().then(t => { throw new Error(t || `HTTP ${res.status}`); });
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                function read() {
                    return reader.read().then(({ done, value }) => {
                        if (done) return;
                        buffer += decoder.decode(value, { stream: true });
                        const parts = buffer.split('\n\n');
                        buffer = parts.pop();

                        for (const part of parts) {
                            const line = part.replace(/^data: /, '').trim();
                            if (!line) continue;
                            try {
                                const msg = JSON.parse(line);

                                if (msg.type === 'rate_limit_wait') {
                                    const pct = msg.progress !== undefined ? Number(msg.progress) : highestProgress;
                                    highestProgress = Math.max(highestProgress, pct);
                                    showProgress(true, `\u23f3 Rate limit \u2014 retry dalam ${msg.remaining}s (${msg.fetched}/${msg.total} terambil)`, pct);
                                    if (retryBtn) retryBtn.style.display = 'inline-block';
                                    return read();
                                }

                                if (msg.type === 'batch_cooldown') {
                                    const pct = msg.progress !== undefined ? Number(msg.progress) : highestProgress;
                                    highestProgress = Math.max(highestProgress, pct);
                                    const m = Math.floor(msg.remaining / 60);
                                    const s = msg.remaining % 60;
                                    const remStr = m > 0 ? `${m}m ${s}s` : `${s}s`;
                                    showProgress(true,
                                        `\u23f1\ufe0f Cooldown batch ${msg.batch} \u2014 lanjut dalam ${remStr} (${msg.fetched}/${msg.total} terambil)`,
                                        pct
                                    );
                                    if (retryBtn) retryBtn.style.display = 'none';
                                    return read();
                                }

                                if (retryBtn) retryBtn.style.display = 'none';

                                if (msg.progress !== undefined) {
                                    const nextPct = Number(msg.progress) || 0;
                                    highestProgress = Math.max(highestProgress, nextPct);
                                    showProgress(true, msg.message || 'Mengambil data...', highestProgress);
                                }

                                if (msg.done) {
                                    if (typeof setFetchInProgress === 'function') setFetchInProgress(false);
                                    btn.disabled = false;
                                    btn.textContent = 'Mulai Batch Crawl';
                                    if (stopBtn) stopBtn.style.display = 'none';
                                    showProgress(false);

                                    if (msg.error) {
                                        if (msg.error.startsWith('WAF_CHALLENGE')) {
                                            triggerAutoSessionSyncAndRetry(false, fetchBatchCrawl.bind(null));
                                        } else {
                                            Swal.fire({ title: 'Gagal', text: msg.error, icon: 'error' });
                                        }
                                        return;
                                    }
                                    if (msg.warning) {
                                        Swal.fire({ title: 'Data Belum Lengkap', text: msg.warning, icon: 'warning' });
                                    }

                                    const fetchedRows = msg.rows || [];
                                    // Batch crawl selalu unfiltered — tandai sebagai isFetchAllComplete
                                    isFetchAllComplete = true;
                                    globalDataCache = fetchedRows;
                                    invalidateLocalCountIndex();
                                    const chkAppend = document.getElementById('chkAppendFilter');
                                    const shouldAppend = chkAppend && chkAppend.checked;
                                    let finalRows = fetchedRows;
                                    if (shouldAppend && datasetState.viewBaseRows && datasetState.viewBaseRows.length > 0) {
                                        const combined = datasetState.viewBaseRows.concat(fetchedRows);
                                        const seen = new Set();
                                        finalRows = [];
                                        for (const r of combined) {
                                            const sid = r && r.sample_id && r.sample_id !== '-' ? r.sample_id : null;
                                            if (sid) {
                                                if (!seen.has(sid)) { seen.add(sid); finalRows.push(r); }
                                            } else {
                                                finalRows.push(r);
                                            }
                                        }
                                        finalRows.forEach((r, i) => r.no = i + 1);
                                    }
                                    renderSampelRows(finalRows);
                                    if (typeof updateDropdownLocalCounts === 'function') updateDropdownLocalCounts();
                                    return;
                                }
                            } catch (e) {
                                console.warn('[fetchBatchCrawl] parse error:', e, line);
                            }
                        }
                        return read();
                    });
                }
                return read();
            })
            .catch(err => {
                if (typeof setFetchInProgress === 'function') setFetchInProgress(false);
                btn.disabled = false;
                btn.textContent = 'Mulai Batch Crawl';
                if (stopBtn) stopBtn.style.display = 'none';
                showProgress(false);
                Swal.fire({ title: 'Gagal Fetch', text: err.message || String(err), icon: 'error' });
            });
    }

        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Memuat...';

        fetch(`/fasihsm-fetcher/api/test-pagination?period_id=${encodeURIComponent(currentPeriodId)}`)
            .then(r => r.json())
            .then(result => {
                btn.disabled = false;
                btn.textContent = origText;

                if (result.error) {
                    Swal.fire({ title: 'Gagal Memuat Preview', text: result.error, icon: 'error' });
                    return;
                }

                const rows = result.rows || [];
                globalDataCache = rows;
                invalidateLocalCountIndex();
                renderSampelRows(rows);
                if (typeof updateDropdownLocalCounts === 'function') updateDropdownLocalCounts();
            })
            .catch(err => {
                btn.disabled = false;
                btn.textContent = origText;
                Swal.fire({ title: 'Error', text: err.message, icon: 'error' });
            });
    }

</script>
